[build-system]
requires = [
    "meson-python>=0.16.0",
    "meson>=1.3.0",
    "pyproject-metadata",
    "ninja>=1.10",
    "numpy>=2.0",
]
build-backend = "mesonpy"


[project]
name = "themachinethatgoesping"
dynamic = ["version"]

description = "Enable advanced processing for multibeam and singlebeam echosounder data.THIS PROJECT IS IN DEVELOPMENT."
readme = "README-project.md"
license = { file = "LICENSE" }

authors = [
    { name = "Peter Urban", email = "peter.urban@ugent.be" },
    { name = "Peter Urban", email = "peter.urban@urcoustics.com" },
]

keywords = [
    "mbes",
    "sbes",
    "watercolumn",
    "echosounder",
    "quantification",
]

classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python",
]

requires-python = ">=3.11,<3.15"

dependencies = [
    # nanobind split mode: the compiled libnanobind backend ships as a separate
    # module. Do NOT add an upper bound or pin a version — newer backends always
    # serve older extensions, and pinning would prevent co-installation with
    # other split-mode projects. See
    # https://nanobind.readthedocs.io/en/latest/split_mode.html
    "nanobind-backend>=1.0",
    "numba",
    "matplotlib",
    "numpy>=1.26.0",
    "tqdm",
    "rasterio>=1.3.10",
    "ipywidgets",
    "pytimeparse2>=1.7.1",
    "pandas>=2.1.0",
    "pyarrow",
    "scipy",
    "pyqtgraph",
    "jupyter-rfb",
    "pyside6",
]


[project.optional-dependencies]
test = [
    "jupyter",
]


[project.urls]
homepage = "https://github.com/themachinethatgoesping"
repository = "https://github.com/themachinethatgoesping"
documentation = "https://themachinethatgoesping.readthedocs.io/en/latest/"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "subprojects/tools/python/tests/",
    "subprojects/algorithms/python/tests/",
    "subprojects/gridding/python/tests/",
    "subprojects/navigation/python/tests/",
    "subprojects/echosounders/python/tests/",
    "subprojects/pingprocessing/python/tests/",
]


[tool.meson-python]
# Produce abi3 (Python stable ABI) wheels. In split mode every nanobind
# extension is built with limited_api (see the subproject meson.build files),
# so a single wheel per platform works on all supported Python versions
# (>= 3.11). With split mode disabled this has no effect (the extensions are
# then version-specific and meson-python tags the wheel accordingly).
# See https://mesonbuild.com/meson-python/how-to-guides/limited-api.html
limited-api = true

[tool.meson-python.args]
setup = [
    "--default-library=static",
    "-Doptimization=3",
]
compile = []
install = [
    "--tags=runtime,python-runtime",
]