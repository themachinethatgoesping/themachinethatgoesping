# Builds and publishes the themachinethatgoesping conda package to the
# themachinethatgoesping channel.
#
# The compiled nanobind split-mode backend ('nanobind-backend') is NOT built
# here -- it is published separately to the same channel by the nanobind fork
# (peter-urban/nanobind, meson-v3.1.0 branch). This recipe depends on it at
# runtime (requirements.run: nanobind-backend >=1.0) and resolves it from the
# themachinethatgoesping channel at test/install time.
#
# Version handling (single source = meson.build):
#   * The package version comes from PKG_VERSION (= ci_scripts/get_version.py),
#     consumed by conda.recipe/recipe.yaml via env.get("PKG_VERSION").
#
# Dev vs. release routing (so conda users can opt in to dev builds):
#   * .dev versions  -> uploaded to the 'dev' anaconda label (overwriting the
#                       previous build of the same version with --force).
#                       Install with: conda install -c themachinethatgoesping/label/dev ...
#   * release versions -> uploaded to the default 'main' label.
#                       Install with: conda install -c themachinethatgoesping ...

name: rattler packages

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/python-package*"
      - ".github/workflows/cibuildwheels*"
      - ".github/workflows/test_*"
      - ".github/workflows/ci-linux*"
      - ".github/workflows/ci-mac*"
      - ".github/workflows/ci-windows*"
      - "*.md"
      - "doc/*"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/workflows/python-package*"
      - ".github/workflows/cibuildwheels*"
      - ".github/workflows/test_*"
      - ".github/workflows/ci-linux*"
      - ".github/workflows/ci-mac*"
      - ".github/workflows/ci-windows*"
      - "*.md"
      - "doc/*"

jobs:
  # Resolve the single-source version (meson.build) and whether it is a .dev
  # release. Both are consumed by the build job below.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      is_dev: ${{ steps.get.outputs.is_dev }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - id: get
        run: |
          VERSION=$(python3 ci_scripts/get_version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if python3 ci_scripts/get_version.py --is-dev; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is a .dev release -> uploaded to the 'dev' conda label."
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is a release -> uploaded to the 'main' conda label."
          fi

  build:
    name: Build package
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      # Single-source version consumed by conda.recipe/recipe.yaml
      PKG_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-platform: linux-64
            output-dir: output
          - os: windows-2025-vs2026
            target-platform: win-64
            output-dir: C:/rattler
          - os: macos-15
            target-platform: osx-arm64
            output-dir: output
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git to skip LFS
        run: |
          git config --global filter.lfs.clean cat
          git config --global filter.lfs.smudge cat
          git config --global filter.lfs.process ''
          git config --global filter.lfs.required false
        shell: bash

      # Set up the runner's native MSVC toolchain for clang-cl (Windows only).
      # Exports INCLUDE/LIB/PATH via GITHUB_ENV, inherited by the rattler-build
      # step below. This replaces conda's vs2022_win-64 activation (see the
      # recipe's win build requirements and the matrix comment above).
      - name: Prepare MSVC (Windows)
        if: runner.os == 'Windows'
        uses: bus1/cabuild/action/msdevshell@v1
        with:
          architecture: x64

      # Build the main package. The split-mode backend (nanobind-backend) is
      # resolved from the themachinethatgoesping channel (published by the
      # nanobind fork) at test time.
      - name: Build themachinethatgoesping conda package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          # Pin a rattler-build that supports abi3 / CEP 20
          # build.python.version_independent and the tests.python.python_version
          # matchspec list. The action's default (v0.44.0) is too old and fails
          # to parse these.
          #rattler-build-version: v0.62.0
          recipe-path: conda.recipe/recipe.yaml
          artifact-name: package-${{ matrix.target-platform }}
          build-args: --output-dir=${{ matrix.output-dir }} --channel themachinethatgoesping --channel https://prefix.dev/conda-forge --target-platform ${{ matrix.target-platform }}${{ matrix.target-platform == 'linux-aarch64' && ' --no-test' || '' }}

      - name: Upload to Anaconda
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Install anaconda-client
          pip install anaconda-client

          # Only the package output subdirs hold the built conda packages; do
          # NOT scan the whole --output-dir (it also contains rattler-build's
          # working tree and caches: <output-dir>/bld/.../packagecache/*.tar.bz2
          # meson source caches like eigen-*.tar.bz2, and <output-dir>/pkg_cache
          # dependency .conda files). `anaconda upload` of a source tarball fails
          # with "Trouble reading metadata ... valid installer". version_independent
          # abi3 packages land in <output-dir>/<platform>/ (subdir=<platform> per
          # CEP 20); noarch is covered too for safety.
          # .dev versions go to the opt-in 'dev' label; releases to 'main'.
          # --force overwrites a previous build of the same version (e.g.
          # re-pushing .dev6).
          if [ "${{ needs.version.outputs.is_dev }}" == "true" ]; then
            LABEL="dev"
          else
            LABEL="main"
          fi
          for d in "${{ matrix.output-dir }}/${{ matrix.target-platform }}" "${{ matrix.output-dir }}/noarch"; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 \( -name "*.conda" -o -name "*.tar.bz2" \) | while read package; do
              echo "Uploading $(basename "$package") to anaconda.org (label: $LABEL)"
              anaconda -t "$ANACONDA_API_TOKEN" upload "$package" --user themachinethatgoesping --label "$LABEL" --force
            done
          done
        shell: bash
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.PREFIX_API_TOKEN }}
