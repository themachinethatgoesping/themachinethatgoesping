# Builds a single abi3 wheel for Windows (x64) using nanobind split mode and
# tests it across all supported Python versions.
#
# The wheel is built with the MINIMUM supported Python (3.11) using clang-cl
# (/MD runtime), producing a 'cp311-abi3-win_amd64' wheel that installs on every
# Python >= 3.11. The compiled libnanobind backend ships separately as the PyPI
# package 'nanobind-backend' (a runtime dependency pulled in automatically on
# install).
#
# NOTE (Windows split-mode ABI): the official 'nanobind-backend' wheel targets
# the MSVC /MD runtime. clang-cl also targets the MSVC ABI (/MD), so the two are
# expected to be compatible. If a platform-ABI mismatch ever shows up at import
# time, ship a custom Windows backend (built with clang-cl) instead — see
# conda.recipe/nanobind-backend for the equivalent recipe.

name: Build Python Package Windows

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/ci*'
      - '.github/workflows/python-package-linux*'
      - '.github/workflows/python-package-mac*'
      - '.github/workflows/cibuildwheels*'
      - '.github/workflows/rattler*'
      - '.github/workflows/test_*'
      - 'conda.recipe/*'
      - '*.md'
      - 'doc/*'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/ci*'
      - '.github/workflows/python-package-linux*'
      - '.github/workflows/python-package-mac*'
      - '.github/workflows/cibuildwheels*'
      - '.github/workflows/rattler*'
      - '.github/workflows/test_*'
      - 'conda.recipe/*'
      - '*.md'
      - 'doc/*'

# make sure that multiple jobs don't run for the same action (new commits cancel old jobs when they are still running)
# Souce Ralf Gommers (commit to meson-python)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Resolve the single-source version (from meson.build) and whether this is a
  # .dev release. PyPI only receives non-dev releases.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      is_dev: ${{ steps.get.outputs.is_dev }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - id: get
        run: |
          VERSION=$(python3 ci_scripts/get_version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if python3 ci_scripts/get_version.py --is-dev; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is a .dev release -> built and tested but NOT published to PyPI."
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is a release -> will be published to PyPI (if on main)."
          fi

  build_wheel:
    name: Build windows abi3 wheel (python 3.11 -> cp311-abi3)
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        boost-version: [1.91.0]
        boost-version_: [1_91_0]
        boost-modules: [--with-iostreams]
        include:
        - toolset: vc145
          compiler: clang-cl
          cpp_std: c++26

    env:
      CC: ${{matrix.compiler}}
      CXX: ${{matrix.compiler}}
      NINJA: c:\ninja.exe

    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: checkout main repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: tmtgp-pypi-windows-abi3  # name for the cache

    # make sure meson can find msvc
    - name: Prepare MSVC
      uses: bus1/cabuild/action/msdevshell@v1
      with:
        architecture: x64

    - name: Cache Boost
      id: cache-boost
      uses: actions/cache@v3
      with:
        path: c:\Boost
        key: windows-${{matrix.toolset}}-boost-${{matrix.boost-version}}-${{matrix.boost-modules}}

    - name: Install boost
      if: steps.cache-boost.outputs.cache-hit != 'true'
      run: |
          Invoke-WebRequest -Uri https://archives.boost.io/release/${{matrix.boost-version}}/source/boost_${{matrix.boost-version_}}.7z -outfile boost.7z
          7z x boost.7z
          cd .\boost_${{matrix.boost-version_}}\
          .\bootstrap.bat ${{matrix.toolset}}
          .\b2.exe install --variant=release --threading=multi --link=static ${{matrix.boost-modules}}
          cd ..

    - name: Install dependencies (pip)
      run: |
        pip install --upgrade pip
        pip install meson meson-python pytest twine wheel pyproject-metadata repairwheel
        pip install -r requirements.txt

    - name: download ninja long path
      run : |
        Invoke-WebRequest -Uri https://raw.githubusercontent.com/themachinethatgoesping/tools/main/ninja-windows/ninja.exe -OutFile c:\ninja.exe

    - name: check ninja executable path
      run: |
        $env:NINJA
        c:\ninja.exe --version

    - name: Build abi3 wheel
      run: |
        # build the abi3 wheel (cp311-abi3, works on all Python >= 3.11)
        New-Item -ItemType Directory -Force -Path dist
        pip wheel -w dist . --config-settings="builddir=b" --config-settings="setup-args=-Dcpp_std=c++latest" --no-deps -v --no-build-isolation --no-cache-dir

    - name: Repair and install wheel
      run: |
        New-Item -ItemType Directory -Force -Path wheelhouse
        $wheelFiles = Get-ChildItem dist/*.whl
        foreach ($wheel in $wheelFiles) {
          repairwheel -o wheelhouse $wheel.FullName
        }
        # installs the abi3 wheel + pulls the nanobind-backend runtime dep from PyPI
        $repairedWheelFile = Get-ChildItem wheelhouse/*.whl | Select-Object -First 1
        if ($repairedWheelFile) {
          pip install $repairedWheelFile.FullName
        } else {
          Write-Host "ERROR: No repaired wheel found in wheelhouse/"
          exit 1
        }

    - name: Store the binary wheel
      uses: actions/upload-artifact@v4
      with:
        name: python-package-windows
        path: wheelhouse

    - name: Test with meson (c++)
      run: |
        c:\ninja.exe test -C b --verbose

    - name: Test with pytest
      run: |
        pytest -v

  # Validate the single abi3 wheel across all supported Python versions.
  test_wheel:
    name: Test abi3 wheel on python 3.${{ matrix.python-3-version }}
    needs: build_wheel
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-3-version: ["11", "12", "13", "14"]
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: 3.${{matrix.python-3-version}}

    - name: checkout main repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false

    - name: Download the abi3 wheel
      uses: actions/download-artifact@v4
      with:
        name: python-package-windows
        path: dist/

    - name: install pip dependencies
      run: pip install pytest typing_extensions

    - name: install wheel
      # the single cp311-abi3 wheel installs on every Python >= 3.11 and pulls
      # the nanobind-backend runtime dependency from PyPI
      run: |
        $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
        pip install $wheel.FullName

    - name: test (pytest)
      run: pytest

  # Publish the abi3 wheel to PyPI, ONLY for non-dev releases.
  publish:
    name: Publish abi3 wheel to PyPI
    needs: [version, test_wheel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.is_dev == 'false'
    runs-on: ubuntu-latest
    steps:
    - name: install pip dependencies
      run: pip install typing_extensions

    - name: Download the abi3 wheel
      uses: actions/download-artifact@v4
      with:
        name: python-package-windows
        path: dist/

    - name: Publish package
      # Packages are only updated when the meson.build version number changes
      # (existing files are skipped, not overwritten).
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: ./dist/

  # delay before attempting to download the packages from pypi
  delay_after_publish:
    needs: publish
    runs-on: ubuntu-latest
    steps:
    - name: Sleep for 10s
      run: sleep 10s
      shell: bash

  test_pypi:
    needs: delay_after_publish
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13','3.14']

    steps:
    - name: checkout main repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: false

    - uses: actions/setup-python@v5
      with:
        python-version: ${{matrix.python-version}}

    - name: install via pip
      run: pip install themachinethatgoesping pytest

    - name: pytest from git repo
      run: pytest -v
