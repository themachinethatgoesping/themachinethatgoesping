# Setup steps for the GitHub Copilot cloud (coding) agent.
#
# Goal: prepare the environment ONCE, before the agent starts, so the agent does
# not waste time/tokens (= AI cost) rediscovering the toolchain, initialising
# submodules, or repeatedly retrying Meson wrap downloads. Mirrors the Linux CI
# (.github/workflows/ci-linux.yml, ubuntu-24.04 matrix entry).
#
# The job MUST be named `copilot-setup-steps` to be picked up by Copilot.
# Only steps/permissions/runs-on/services/snapshot/timeout-minutes are honoured.

name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 59
    permissions:
      contents: read # needed to checkout the repo + submodules

    steps:
      - name: Checkout (with submodules, recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: copilot-setup-ubuntu-24.04

      - name: Install C++ toolchain and dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc-14 g++-14 ccache pkg-config cmake ninja-build \
            python3-pip libboost-all-dev libcurl4-openssl-dev libomp-dev \
            libgl1 libglib2.0-0 libegl1 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          # C++23 needs gcc-14/g++-14 as the default compiler
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 140

      - name: Install Meson / Python build + runtime requirements
        run: |
          sudo pip install meson meson-python ninja --break-system-packages
          pip install pytest numpy --break-system-packages
          pip install -r requirements.txt --break-system-packages

      - name: Pre-configure Meson (downloads & caches all wrap dependencies)
        # Runs with full network here, so all .wrap dependencies (eigen, fmt,
        # xtensor, nanobind, catch2, ...) are fetched now and cached in builddir/
        # and ~/.cache, instead of during the agent session.
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          meson setup builddir \
            -Dunity=on -Dunity_size=9999999 \
            -Dpython.install_env=auto \
            --default-library=static
