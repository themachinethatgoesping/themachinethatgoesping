# This workflow will install Python dependencies, run tests and lint with a variety of Python versions

name: Build Python Package macOS

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/ci*"
      - ".github/workflows/python-package-linux*"
      - ".github/workflows/python-package-windows*"
      - ".github/workflows/cibuildwheels*"
      - ".github/workflows/rattler*"
      - ".github/workflows/test_*"
      - "conda.recipe/*"
      - "*.md"
      - "doc/*"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/workflows/ci*"
      - ".github/workflows/python-package-linux*"
      - ".github/workflows/python-package-windows*"
      - ".github/workflows/cibuildwheels*"
      - ".github/workflows/rattler*"
      - ".github/workflows/test_*"
      - "conda.recipe/*"
      - "*.md"
      - "doc/*"

# make sure that multiple jobs don't run for the same action (new commits cancel old jobs when they are still running)
# Souce Ralf Gommers (commit to meson-python)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_wheel:
    name: build macos-14 python${{ matrix.python-version }}

    # Build on the OLDEST supported runner: the wheel and the GCC runtime
    # libraries bundled into it inherit the runner's minimum macOS version, and
    # forward compatibility (14 -> 15 -> 26) works while backward does not.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tmtgp-pypi-mac-gcc-${{ matrix.python-version }} # name for the cache

      # Apple/LLVM libc++ has not implemented std::chrono::parse yet
      # (LLVM #166051), so macOS wheels are built with Homebrew GCC (libstdc++).
      - name: Install build dependencies (brew)
        run: brew install boost gcc libomp

      - name: Install dependencies (pip)
        run: |
          pip install meson meson-python ninja pytest twine wheel repairwheel
          pip install -r requirements.txt

      - name: Build wheel (GCC / libstdc++)
        run: |
          GCC_VER=$(brew info --json gcc | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['versions']['stable'].split('.')[0])")
          export CC="$(brew --prefix gcc)/bin/gcc-$GCC_VER"
          export CXX="$(brew --prefix gcc)/bin/g++-$GCC_VER"
          export BOOST_ROOT="$(brew --prefix boost)"
          export PKG_CONFIG_PATH="$(brew --prefix boost)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          # resolve Python C-API symbols at load time; strip dead code
          export LDFLAGS="-Wl,-undefined,dynamic_lookup -Wl,-dead_strip"
          pip wheel -w dist . --no-deps -v --config-settings="builddir=pybuild"

      - name: Bundle GCC runtime libs into the wheel (repairwheel/delocate)
        run: repairwheel -o wheelhouse dist/*.whl

      - name: Add bundled-runtime license texts to the wheel
        run: |
          curl -sSL --retry 3 -o COPYING3 https://raw.githubusercontent.com/gcc-mirror/gcc/master/COPYING3
          curl -sSL --retry 3 -o COPYING.RUNTIME https://raw.githubusercontent.com/gcc-mirror/gcc/master/COPYING.RUNTIME
          for whl in wheelhouse/*.whl; do
            python ci_scripts/inject_runtime_licenses.py "$whl" \
              --license GPL-3.0-or-later.txt=COPYING3 \
              --license GCC-Runtime-Library-Exception-3.1.txt=COPYING.RUNTIME \
              --license README-bundled-runtime.md=ci_scripts/runtime-licenses/README-bundled-runtime.md
          done

      - name: Install the built wheel
        run: pip install wheelhouse/*.whl

      - name: Store the binary wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheel-py${{ matrix.python-version }}
          path: wheelhouse

      - name: Test with meson (c++)
        run: meson test -C pybuild --print-errorlogs

      - name: Test with pytest
        run: pytest -v

  install_and_test:
    name: Install/test ${{matrix.os}} / python 3.${{ matrix.python-3-version }}
    needs: build_wheel
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-3-version: ["11", "12", "13", "14"]
        # the single macos-14 wheel must install & pass on macOS 14, 15 and 26
        os: ["macos-14", "macos-15", "macos-26"]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: 3.${{matrix.python-3-version}}

      #necessary only for pytest
      - name: checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Download the macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-wheel-py3.${{matrix.python-3-version}}
          path: dist/

      - name: install pip dependencies
        # missing typing_extensions caused an error with pypi-publish ...
        run: |
          pip install --upgrade pip
          pip install pytest typing_extensions

      - name: install wheel
        run: pip install $(ls dist/*.whl)

      - name: test (pytest)
        run: pytest -v

  publish_wheels:
    needs: install_and_test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-3-version: ["11", "12", "13", "14"]

    steps:
      - uses: actions/setup-python@v5

      - name: install pip dependencies
        # missing typing_extensions caused an error with pypi-publish ...
        run: pip install typing_extensions

      - name: Download the macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-wheel-py3.${{matrix.python-3-version}}
          path: dist/

      - name: Publish package
        # Note 1: In the future the skip existing option should be removed and replaced with the only publish on tags option (if)
        # Note 2: Packages will only be updated when the meson.build version number is changed! (existing will be skipped not updated)
        # Note 3: In the future this should better build against test.pypi repository!
        #if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: ./dist/

  # delay for one minute before attempting to download the packages from pypi
  delay_after_publish:
    needs: publish_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Sleep for 10s
        run: sleep 10s
        shell: bash

  test_pypi:
    needs: delay_after_publish
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13', '3.14']
        os: ["macos-14", "macos-15", "macos-26"]
        arch: ["arch -arm64"]

    steps:
      - name: checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}

      - name: install pip
        run: |
          ${{matrix.arch}} pip install --upgrade pip          

      - name: Debug pip
        run: |
          ${{matrix.arch}} pip --version
          ${{matrix.arch}} pip debug -v

      - name: install via pip
        run: ${{matrix.arch}} pip install themachinethatgoesping pytest ${{matrix.pip-pre}}

      - name: pytest from git repo
        run: ${{matrix.arch}} pytest -v
