# Builds a single abi3 wheel for macOS (arm64) using nanobind split mode and
# tests it across all supported Python versions and macOS releases.
#
# The wheel is built with the MINIMUM supported Python (3.12) and the oldest
# supported deployment target (14.0), producing a 'cp312-abi3-macosx_14_0_arm64'
# wheel that installs on every Python >= 3.12 and macOS >= 14. The compiled
# libnanobind backend ships separately as the PyPI package 'nanobind-backend'
# (a runtime dependency, pulled in automatically on install).

name: Build Python Package macOS

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/ci*"
      - ".github/workflows/python-package-linux*"
      - ".github/workflows/python-package-windows*"
      - ".github/workflows/cibuildwheels*"
      - ".github/workflows/rattler*"
      - ".github/workflows/test_*"
      - "conda.recipe/*"
      - "*.md"
      - "doc/*"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/workflows/ci*"
      - ".github/workflows/python-package-linux*"
      - ".github/workflows/python-package-windows*"
      - ".github/workflows/cibuildwheels*"
      - ".github/workflows/rattler*"
      - ".github/workflows/test_*"
      - "conda.recipe/*"
      - "*.md"
      - "doc/*"

# make sure that multiple jobs don't run for the same action (new commits cancel old jobs when they are still running)
# Souce Ralf Gommers (commit to meson-python)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Resolve the single-source version (from meson.build) and whether this is a
  # .dev release. PyPI only receives non-dev releases.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      is_dev: ${{ steps.get.outputs.is_dev }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - id: get
        run: |
          VERSION=$(python3 ci_scripts/get_version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if python3 ci_scripts/get_version.py --is-dev; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is a .dev release -> built and tested but NOT published to PyPI."
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is a release -> will be published to PyPI (if on main)."
          fi

  build_wheel:
    name: Build macOS arm64 abi3 wheel (python 3.12 -> cp312-abi3)
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ARCH: "arch -arm64"
      FLAGS: LDFLAGS="-undefined dynamic_lookup -Wl -Wl,-dead_strip"
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tmtgp-pypi-mac-abi3-arm64

      - name: Install libomp, boost and gdal
        # gdal provides gdal-config so that rasterio (a runtime dependency) can
        # build from source when no matching wheel is published for the build
        # Python on macOS arm64.
        run: ${{ env.ARCH }} brew install libomp boost gdal

      - name: Install dependencies (pip)
        run: |
          ${{ env.ARCH }} pip install meson meson-python ninja pytest twine wheel repairwheel
          ${{ env.ARCH }} pip install -r requirements.txt

      - name: Build abi3 wheel
        run: |
          # build the abi3 wheel (cp312-abi3, works on all Python >= 3.12)
          BOOST_ROOT=$(brew --prefix boost) ${{ env.FLAGS }} ${{ env.ARCH }} pip wheel -w dist . --no-deps -v --config-settings="builddir=pybuild"

      - name: Repair and install wheel
        run: |
          ${{ env.ARCH }} repairwheel -o wheelhouse dist/*
          # installs the abi3 wheel + pulls the nanobind-backend runtime dep from PyPI
          ${{ env.ARCH }} pip install wheelhouse/*

      - name: Store the binary wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-package-macos
          path: wheelhouse

      - name: Test with meson (c++)
        run: ${{ env.ARCH }} meson test -C pybuild --print-errorlogs

      - name: Test with pytest
        run: ${{ env.ARCH }} pytest -v

  # Validate the single abi3 wheel across supported Python versions and macOS releases.
  test_wheel:
    name: Test abi3 wheel ${{ matrix.os }} / python 3.${{ matrix.python-3-version }}
    needs: build_wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        arch: ["arch -arm64"]
        python-3-version: ["12", "13", "14"]
        os: ["macos-14", "macos-15"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: 3.${{ matrix.python-3-version }}

      - name: checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Download the abi3 wheel
        uses: actions/download-artifact@v4
        with:
          name: python-package-macos
          path: dist/

      - name: install pip dependencies
        run: |
          ${{ matrix.arch }} pip install --upgrade pip
          ${{ matrix.arch }} pip install pytest typing_extensions

      - name: install wheel
        # the single cp312-abi3 wheel installs on every Python >= 3.12 and pulls
        # the nanobind-backend runtime dependency from PyPI
        run: ${{ matrix.arch }} pip install dist/*.whl

      - name: test (pytest)
        run: ${{ matrix.arch }} pytest -v

  # Publish the abi3 wheel to PyPI, ONLY for non-dev releases.
  publish:
    name: Publish abi3 wheel to PyPI
    needs: [version, test_wheel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.is_dev == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Download the abi3 wheel
        uses: actions/download-artifact@v4
        with:
          name: python-package-macos
          path: dist/

      - name: Publish package
        # Packages are only updated when the meson.build version number changes
        # (existing files are skipped, not overwritten).
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: ./dist/

  # delay before attempting to download the packages from pypi
  delay_after_publish:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Sleep for 10s
        run: sleep 10s
        shell: bash

  test_pypi:
    needs: delay_after_publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12','3.13', '3.14']
        os: ["macos-14", "macos-15"]
        arch: ["arch -arm64"]
    steps:
      - name: checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install via pip
        run: ${{ matrix.arch }} pip install themachinethatgoesping pytest

      - name: pytest from git repo
        run: ${{ matrix.arch }} pytest -v
