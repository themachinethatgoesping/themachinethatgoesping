[workspace]
name = "themachinethatgoesping"
channels = ["conda-forge", "themachinethatgoesping"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12"

# Python runtime dependencies from Conda
numba = "*"
matplotlib = "*"
numpy = ">=1.26"
tqdm = "*"
rasterio = ">=1.3.10"
ipywidgets = "*"
pytimeparse2 = ">=1.7.1"
pandas = ">=2.1.0"
pyarrow = "*"
scipy = "*"
pyqtgraph = "*"
jupyter-rfb = "*"
pyside6 = "*"

[pypi-dependencies]
# nanobind split-mode backend (compiled libnanobind). Not yet on conda-forge,
# so pull the manylinux wheel from PyPI (works inside the conda env). Once the
# 'nanobind-backend' package is published to the themachinethatgoesping conda
# channel, this can move to [dependencies]. No upper bound / pin.
nanobind-backend = ">=1.0"

# Build dependencies
meson = ">=1.2.3"
meson-python = ">=0.15.0"
ninja = ">=1.10"
pybind11-stubgen = "*"
clang = "*"

# Testing / development
pytest = "*"
jupyter = "*"
jupyterlab = "*"
nbmake = "*"
ipympl = "*"
ipyleaflet = "*"
gsw = "*"
tabulate = "*"
openpyxl = "*"
trame-pyvista = ">=0.1.7,<0.2"


[tasks]
test = "pytest -v"
build = "python -m build"


[feature.build.dependencies]
python-build = ">=1.6.0,<2"
twine = ">=7.0.0,<8"
anaconda-client = ">=1.14.1,<2"
rattler-build = ">=0.75.0"
conda-recipe-manager = "*"


[feature.build.tasks]
# Build the main package. PKG_VERSION is single-sourced from meson.build
# (see ci_scripts/get_version.py) and consumed by the recipe via env.get.
# The split-mode backend (nanobind-backend) is resolved from the
# themachinethatgoesping channel (published by the nanobind fork).
build-conda = "PKG_VERSION=$(python ci_scripts/get_version.py) rattler-build build --recipe conda.recipe/recipe.yaml --output-dir output --channel themachinethatgoesping --channel conda-forge"
build-pypi = "python -m build"
upload-pypi = { cmd = "twine upload dist/*", depends-on = ["build-pypi"] }


[environments]
default = { solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
