python:
# Build ONCE on the minimum supported Python. The extensions are abi3
# (split-mode / limited API), so a single build works on all newer Python
# versions; combined with `build.python.version_independent: true` in
# recipe.yaml this produces one package per OS that installs on 3.12-3.14.
# (Note: versions are _strings_, not numbers.)
- "3.12"

# Raise the macOS deployment target so it is applied at compiler-activation
# time (the export in recipe.yaml runs too late to affect -mmacosx-version-min).
# Required for newer libc++ features such as the floating-point std::to_chars
# overloads, which are availability-gated to macOS 13.4+. Set to 15.0 to track
# the macOS 15 toolchain/runners (rasterio ships macOS-15-only wheels from
# 1.5.2 on, so macOS 14 is no longer targeted).
MACOSX_DEPLOYMENT_TARGET:
- "15.0"
