context:
  # Single source of truth for the version is the top-level meson.build.
  # CI and the pixi 'build-conda' task export PKG_VERSION
  # (= python ci_scripts/get_version.py). The "0.0.0" fallback only applies to
  # ad-hoc local builds that forget to set it. (rattler-build's env.get takes
  # the default as a keyword argument.)
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: themachinethatgoesping
  version: ${{ version }}

source:
  #path: ../
  git: https://github.com/themachinethatgoesping/themachinethatgoesping.git

build:
  # abi3 / split-mode extensions are not Python-version specific, so build ONCE
  # (on the minimum Python, see variants.yaml) and mark the package as
  # version-independent (CEP 20). rattler-build then produces one package per OS
  # (subdir: <platform>, noarch: python) that installs on all supported Python
  # versions; the import tests below verify 3.12-3.14.
  python:
    version_independent: true
  script:
    - if: unix
      then:
        - export CPPFLAGS="-I$PREFIX/include $CPPFLAGS" # [unix]
        - export LDFLAGS="-L$PREFIX/lib $LDFLAGS" # [unix]
        - export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" # [unix]
        - export BOOST_ROOT="$PREFIX" # [unix]
        
        # --no-deps: build only from conda host/run deps, never pull runtime deps from PyPI
        - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -v --config-settings=setup-args="-Dunity=on" --config-settings=setup-args="-Dunity_size=999999999" --config-settings=setup-args="-Ddynamic_boost=enabled" --config-settings=setup-args="-Dforce_openmp=enabled"
    - if: win
      then:
        - set CC=clang-cl
        - set CXX=clang-cl
        - set CXXFLAGS=%CXXFLAGS% /EHsc #split in two lines to avoid issues with the conda build system
        - set AR=llvm-lib # Add this line - use LLVM archiver instead of lib.exe
        - set BOOST_ROOT=%PREFIX%\Library # [win]
        - set PATH=%PREFIX%\Library\bin;%PATH% # [win]
        - set INCLUDE=%PREFIX%\Library\include;%INCLUDE% # [win]
        - set LIB=%PREFIX%\Library\lib;%LIB% # [win]
        - curl -L https://raw.githubusercontent.com/themachinethatgoesping/tools/main/ninja-windows/ninja.exe -o ninja.exe # [win]
        - set NINJA=%CD%\ninja.exe # [win]
        - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -v --config-settings=setup-args="-Dunity=on" --config-settings=setup-args="-Dunity_size=999999999" --config-settings=setup-args="-Ddynamic_boost=enabled" --config-settings=setup-args="-Dforce_openmp=enabled" --config-settings=setup-args="-Dcpp_std=c++latest"

    - if: osx
      then:
        - export MACOSX_DEPLOYMENT_TARGET=14.0 # [osx]
        - export CXXFLAGS="-stdlib=libc++ $CXXFLAGS" # [osx]
        - export LDFLAGS="-undefined dynamic_lookup -Wl,-no_fixup_chains -Wl,-dead_strip"
        - export CXXFLAGS="${CXXFLAGS} -D_LIBCPP_DISABLE_AVAILABILITY" # [osx]

    - if: osx
      then:
        - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -v --config-settings=setup-args="-Dunity=on" --config-settings=setup-args="-Dunity_size=999999999" --config-settings=setup-args="-Ddynamic_boost=enabled" --config-settings=setup-args="-Dforce_openmp=enabled"
    

  number: 0

requirements:
  build:
    - meson>=1.9.0
    - ninja
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - pkgconfig
    - boost-cpp >=1.84.0
    - if: win
      then:
        - clang # Use clang toolchain consistently
        - lld # Use LLD linker (not lib.exe)
        - llvm-tools # Add LLVM tools including llvm-lib
        - llvm-openmp # [win]
    - if: osx
      then:
        - clang_osx-arm64 =19 # [osx] - Pin to 19 to avoid clang 20 availability macro bug
        - clangxx_osx-arm64 =19 # [osx]
        - llvm-openmp # [osx] - Keep for macOS

  host:
    - python
    - meson-python>=0.15.0
    - pybind11>=2.13.2,<2.14.0
    - numpy>=2.0.0,<2.5
    - pip
    - boost-cpp >=1.84.0
    - pyarrow
    - pandas >=2.0
    - if: win
      then:
        - vs2022_win-64 # [win]
        - llvm-openmp # [win] - Keep LLVM OpenMP
    - if: osx
      then:
        - libcxx =19 # [osx] - Match clang version to avoid availability.h bug
        - llvm-openmp # [osx]

  run:
    # abi3 floor: the single build targets the Python 3.12 stable ABI, so it
    # runs on any Python >= 3.12 (version_independent package).
    - python >=3.12
    - numba
    # nanobind split-mode backend (compiled libnanobind), imported at runtime.
    # Published to the themachinethatgoesping conda channel by the nanobind fork
    # (peter-urban/nanobind, meson-v3.1.0 branch, conda.recipe). No upper bound
    # / pin: newer backends always serve older extensions.
    - nanobind-backend >=1.0
    #- ${{ pin_compatible('boost-cpp') }}
    - boost-cpp >=1.84.0
    - ipywidgets
    - ipympl
    - matplotlib
    - pyarrow
    - pandas >=2.0
    - rasterio >= 1.3.10
    - tqdm
    - scipy
    - pytimeparse2
    - numpy < 2.4
    - pyqtgraph
    - jupyter-rfb
    - pyside6
    - if: win
      then:
        - llvm-openmp # [win] - Add back LLVM OpenMP for Windows runtime
        - nomkl
    - if: osx
      then:
        - llvm-openmp # [osx] - Keep for macOS
        - nomkl

tests:
  - python:
      imports:
        - themachinethatgoesping
        # Explicitly import each native abi3 module so the multi-version test
        # below actually loads the compiled extensions (against the matching
        # per-version nanobind-backend), not just the pure-python top package.
        - themachinethatgoesping.tools_nanopy
        - themachinethatgoesping.algorithms_nanopy
        - themachinethatgoesping.navigation_nanopy
        - themachinethatgoesping.echosounders_nanopy
        - themachinethatgoesping.pingprocessing_nanopy
      # The single abi3 build must import on every supported Python version.
      # rattler-build creates a fresh test env per version (installing the
      # matching per-version nanobind-backend), proving the build-once package
      # works on 3.12-3.14.
      python_version:
        - "3.12.*"
        - "3.13.*"
        - "3.14.*"
      # pip_check is disabled because the split-mode backend 'nanobind-backend'
      # is provided as a conda package (from the themachinethatgoesping channel)
      # without pip .dist-info metadata, so `pip check` cannot see it as
      # satisfying the wheel's `Requires-Dist: nanobind-backend`. The import test
      # above still verifies that the package (and its backend) actually load.
      pip_check: false

about:
  #home: https://github.com/themachinethatgoesping
  summary: Enable advanced processing for multibeam and singlebeam echosounder data. THIS PROJECT IS IN DEVELOPMENT.
  license: MPL-2.0
  license_file: LICENSE
